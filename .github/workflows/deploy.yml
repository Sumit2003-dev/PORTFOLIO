name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for Profile Sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install beautifulsoup4

      - name: Sync Latest Skills Boost Profile
        run: python scripts/sync_skills_profile.py --build-step

      - name: Sync Developer Activity Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_developer_activity.py --build-step

      - name: Commit and Push Snapshot (if updated)
        run: |
          if [ -n "$(git status --porcelain public/data/skills-snapshot.json public/data/developer-activity.json public/data/leetcode-activity.json public/data/github-activity.json src/lib/googleSkillsBadges.json src/lib/googleDeveloperData.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/skills-snapshot.json public/data/developer-activity.json public/data/leetcode-activity.json public/data/github-activity.json src/lib/googleSkillsBadges.json src/lib/googleDeveloperData.ts
            git commit -m "chore(data): auto-sync Google Skills and developer activity snapshots [skip ci]"
            git push origin main
          else
            echo "No snapshot updates detected; repository is current."
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build

      - name: Create 404 Fallback for Single-Page Routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
