name: Sync Google Cloud Skills Boost Profile

on:
  schedule:
    # Run every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "skills-sync"
  cancel-in-progress: false

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Sync Google Skills Profile Snapshot
        run: python scripts/sync_skills_profile.py

      - name: Check for Snapshot Changes
        id: git-diff
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain public/data/skills-snapshot.json src/lib/googleSkillsBadges.json src/lib/googleDeveloperData.ts)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Updated Snapshot
        if: steps.git-diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/skills-snapshot.json src/lib/googleSkillsBadges.json src/lib/googleDeveloperData.ts
          git commit -m "chore(skills): auto-sync Google Cloud Skills Boost profile snapshot"
          git push origin main
